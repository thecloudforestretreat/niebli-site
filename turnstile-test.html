<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Turnstile staging test | Niebli</title><style>body{max-width:680px;margin:60px auto;padding:24px;background:#11201d;color:#f4ede3;font:17px/1.6 system-ui}button{padding:12px;margin-top:20px}a{color:inherit}</style></head><body><a href="/">Niebli staging</a><h1>Turnstile verification test</h1><p>Development only. This sends a Turnstile token to our staging server for validation. It collects no name, email, or message and sends no notifications.</p><form id="test"><div class="cf-turnstile" data-sitekey="0x4AAAAAAFQZJSrYZhZo9CzX" data-action="staging_check"></div><button type="submit">Verify test token</button></form><p id="result" role="status" aria-live="polite"></p><script>
const form=document.getElementById('test'),result=document.getElementById('result');
form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');const token=new FormData(form).get('cf-turnstile-response');if(!token){result.textContent='Please wait for verification to finish.';return;}button.disabled=true;result.textContent='Checking with the server…';try{const response=await fetch('/api/turnstile-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const data=await response.json();result.textContent=response.ok&&data.verified?'Verified by the server. No personal data was saved.':(data.error||'Verification failed. Please try again.');}catch{result.textContent='Verification unavailable. Please try again.';}finally{button.disabled=false;if(window.turnstile)turnstile.reset();}});
</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></body></html>
